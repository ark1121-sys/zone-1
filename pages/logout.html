        <!-- Logout (Active) -->

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-gray-50 flex items-center justify-center p-8 md:p-12">
        
        <!-- Logout Card -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-10 max-w-lg w-full text-center">
            <!-- Icon -->
            <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="log-out" class="w-10 h-10 text-red-500"></i>
            </div>
            
            <!-- Heading -->
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Ready to leave?</h1>
            
            <!-- Description -->
            <p class="text-gray-500 mb-8 leading-relaxed">
                You're about to log out of your Zone Pro Trader account.<br>
                Your data will be safely stored for when you return.
            </p>
            
            <!-- Actions -->
            <div class="flex gap-4">
                <button onclick="history.back()" class="flex-1 px-6 py-3 rounded-xl border border-gray-300 text-gray-700 font-semibold hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Go Back
                </button>
                <button onclick="handleLogout()" class="flex-1 px-6 py-3 rounded-xl bg-red-600 text-white font-semibold hover:bg-red-700 transition-colors flex items-center justify-center gap-2 shadow-lg shadow-red-100">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                </button>
            </div>
        </div>

    </main>

    <script type="module">
        import { auth } from "../firebase/firebase-config.js";
        import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        window.handleLogout = async function() {
            try {
                await signOut(auth);
            } catch (e) {
                console.warn("Sign out error:", e);
            }
            localStorage.removeItem("zp_uid");
            localStorage.removeItem("zp_user");
            localStorage.removeItem("zp_name");
            localStorage.removeItem("zp_photo");
            localStorage.removeItem("firebase_id_token");
            window.location.href = "login.html";
        };
    </script>
    <script>
        lucide.createIcons();
    </script>

</html>
