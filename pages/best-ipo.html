    <script>
        lucide.createIcons();

        // Mobile Sidebar Logic
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const mobileSidebarToggle = document.getElementById('mobile-sidebar-toggle');
        const mobileSidebarClose = document.getElementById('mobile-sidebar-close');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
            setTimeout(() => {
                sidebarOverlay.classList.toggle('opacity-0');
            }, 50);
        }

        if (mobileSidebarToggle) mobileSidebarToggle.addEventListener('click', toggleSidebar);
        if (mobileSidebarClose) mobileSidebarClose.addEventListener('click', toggleSidebar);
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);
    </script>

    <script>
    /* ── Mobile Sidebar Toggle ── */
    (function(){
        var aside = document.querySelector('aside');
        var overlay = document.getElementById('sidebar-overlay');
        var openBtn = document.getElementById('hamburger-btn');
        var closeBtn = document.getElementById('sidebar-close-btn');
        var uid = localStorage.getItem('zp_uid') || '';
        var av = document.getElementById('topbar-avatar');
        if(av && uid){ av.textContent = uid.substring(0,2).toUpperCase(); }
        function openSidebar(){
            aside && aside.classList.add('sidebar-open');
            overlay && overlay.classList.add('active');
            document.body.style.overflow='hidden';
        }
        function closeSidebar(){
            aside && aside.classList.remove('sidebar-open');
            overlay && overlay.classList.remove('active');
            document.body.style.overflow='';
        }
        openBtn && openBtn.addEventListener('click', openSidebar);
        closeBtn && closeBtn.addEventListener('click', closeSidebar);
        overlay && overlay.addEventListener('click', closeSidebar);
        aside && aside.querySelectorAll('a').forEach(function(a){
            a.addEventListener('click', function(){ if(window.innerWidth<768) closeSidebar(); });
        });
    })();
    </script>
